# Publishes the app + your ./pictures folder to GitHub Pages on every push to main.
# The pictures list (pictures/index.json) is regenerated automatically on each run,
# so "add a photo to pictures/ and push" is all it takes.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir _site
          cp index.html generate-manifest.js _site/
          if [ -d pictures ]; then cp -r pictures _site/; fi
          node _site/generate-manifest.js
          rm _site/generate-manifest.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
